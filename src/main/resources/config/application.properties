#
# Application configuration file.
#

#
# Application information.
#
# All "info.*" properties will be exposed, by default, at "/info".
#
# Any property value inside "@..@" will be replaced at build-time by the corresponding maven
# property.
# 

info.build.artifact=@project.artifactId@
info.build.name=@project.name@
info.build.description=@project.description@
info.build.version=@project.version@

#
# Log level configuration.
#
#    Name: logging.level.<logger-name>  
#    Type: enumeration [TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF]
# Default: *=INFO
#
logging.level.org.springframework=INFO
logging.level.uk.co.caprica.bootlace=DEBUG

#
# Enable or disable pretty-printing of the JSON returned by the web-services.
#
#    Name: app.prettyJson
#    Type: boolean
# Default: true
#
#app.prettyJson=true

#
# Set the password encoder strength.
#
#    Name: app.passwordEncoderStrength
#    Type: integer
# Default: -1 (which currently equates to an actual value of 10 in the encoder)
#
#app.passwordEncoderStrength=10

#
# MongoDB Configuration - Step 4: Implement MongoDB Best Practices
# This configuration implements authentication, connection pooling, and proper error handling
#

# Basic MongoDB Connection Settings
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=bootlace

# Authentication Configuration (uncomment and configure for production)
# Enable these settings when MongoDB authentication is required
#spring.data.mongodb.username=bootlace_user
#spring.data.mongodb.password=secure_password
#spring.data.mongodb.authentication-database=admin

# Connection Pool Settings for Optimal Performance
# Maximum number of connections in the connection pool
spring.data.mongodb.connection-pool.max-size=100
# Minimum number of connections in the connection pool
spring.data.mongodb.connection-pool.min-size=10
# Maximum time to wait for a connection (milliseconds)
spring.data.mongodb.connection-pool.max-wait-time=120000
# Maximum idle time for connections (0 = no limit)
spring.data.mongodb.connection-pool.max-connection-idle-time=0
# Maximum lifetime for connections (0 = no limit)
spring.data.mongodb.connection-pool.max-connection-life-time=0

# Socket Configuration for Better Network Handling
# Connection timeout (milliseconds)
spring.data.mongodb.socket.connect-timeout=10000
# Read timeout (0 = no timeout)
spring.data.mongodb.socket.read-timeout=0

# Server Monitoring Settings
# Heartbeat frequency for server monitoring (milliseconds)
spring.data.mongodb.server.heartbeat-frequency=10000
# Minimum heartbeat frequency (milliseconds)
spring.data.mongodb.server.min-heartbeat-frequency=500

# SSL/TLS Configuration (uncomment for secure connections)
#spring.data.mongodb.ssl.enabled=true
#spring.data.mongodb.ssl.invalid-hostname-allowed=false

# Replica Set Configuration (uncomment if using replica sets)
#spring.data.mongodb.replica-set-name=rs0

# Write Concern Configuration for Data Consistency
# Options: ACKNOWLEDGED, W1, W2, W3, UNACKNOWLEDGED, JOURNALED, MAJORITY
spring.data.mongodb.write-concern=ACKNOWLEDGED

# Read Preference Configuration
# Options: PRIMARY, PRIMARY_PREFERRED, SECONDARY, SECONDARY_PREFERRED, NEAREST
spring.data.mongodb.read-preference=PRIMARY

# Connection String Alternative (use instead of individual properties if preferred)
# Uncomment and modify as needed - this overrides individual properties above
#spring.data.mongodb.uri=mongodb://username:password@localhost:27017/bootlace?authSource=admin&maxPoolSize=100&minPoolSize=10

#management.server.port = -1

# MongoDB Metrics Configuration
# Re-enable connection pool metrics now that we have proper configuration
management.metrics.mongo.connectionpool.enabled=true
# Enable MongoDB command metrics
management.metrics.mongo.command.enabled=true
